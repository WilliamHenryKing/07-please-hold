<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PLEASE HOLD</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#1d2130" />
    <meta name="description" content="Navigate a zero-gravity lounge by pushing, grabbing and throwing" />
    <style>
      /* Arrival veil: a padded porthole onto the planet, lifted by worldReady() in src/loader.ts. */
      #arrival { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; align-content: center; gap: 18px; background: radial-gradient(circle at 50% 42%, #f4ead8 0, #e3c7a1 55%, #c9a57e 100%); color: #3a2a22; font: 700 13px/1.3 ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.22em; text-transform: uppercase; text-align: center; transition: opacity 0.6s ease, visibility 0.6s; }
      #arrival.is-done { opacity: 0; visibility: hidden; }
      #arrival .port { width: 120px; height: 120px; border-radius: 50%; border: 10px solid #b8bcc2; box-shadow: 0 0 0 12px #ecdcc8, 0 10px 30px #3a2a2244; background: radial-gradient(circle at 78% 120%, #d9a07a 0 30%, #4f7f8f 31% 52%, #f2a07b 53%, #1d2130 58%); overflow: hidden; animation: arrival-bob 3s ease-in-out infinite; }
      #arrival .title { font-size: 22px; letter-spacing: 0.3em; color: #8c3b3b; }
      #arrival .sub { max-width:calc(100vw - 32px); font-weight: 500; letter-spacing: 0.12em; text-transform: none; font-size: 14px; opacity: 0.8; }
      #arrival .bar { width: 140px; height: 4px; border-radius: 4px; background: #3a2a2222; overflow: hidden; }
      #arrival .bar i { display: block; height: 100%; width: 40%; border-radius: 4px; background: #d9a441; animation: arrival-slide 1.2s ease-in-out infinite; }
      @keyframes arrival-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes arrival-bob { 50% { transform: translateY(-6px) rotate(3deg); } }
      @media (prefers-reduced-motion: reduce) { #arrival .bar i { animation: none; width: 100%; } #arrival .port { animation: none; } }
    </style>
  </head>
  <body>
    <div id="arrival" role="status" aria-live="polite"><div class="port" aria-hidden="true"></div><span class="title">PLEASE HOLD</span><span class="sub">Your attendant will be with you shortly</span><div class="bar"><i></i></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
